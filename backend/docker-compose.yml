services:
  mysql:
    image: mysql:8.4
    container_name: mobile-backend-mysql
    environment:
      MYSQL_DATABASE: mobile_app
      MYSQL_USER: mobile_user
      MYSQL_PASSWORD: mobile_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Ejecuta `mvn spring-boot:run` en el equipo; este servicio solo contiene MySQL.

volumes:
  mysql_data:
