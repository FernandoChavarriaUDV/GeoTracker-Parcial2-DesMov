services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: geotracker
      MYSQL_USER: geotracker
      MYSQL_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD}
    command: ["--innodb-buffer-pool-size=128M"]
    volumes:
      - geotracker_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  api:
    build:
      context: .
      dockerfile: Dockerfile.runtime
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/geotracker?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: geotracker
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET}
      LIVENESS_ENABLED: "false"
      SERVER_PORT: 8080
    ports:
      - "127.0.0.1:8080:8080"
volumes:
  geotracker_mysql:
